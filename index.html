<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Eternal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
    scroll-behavior:smooth;
}

body{
    background:#000;
    color:#fff;
    overflow-x:hidden;
}

#particles-js{
    position:fixed;
    width:100%;
    height:100%;
    z-index:-1;
}

header{
    background:linear-gradient(90deg,#000,#8b0000);
    padding:20px;
    text-align:center;
    border-bottom:2px solid red;
}

header h1{
    font-size:40px;
    letter-spacing:4px;
    color:red;
    text-shadow:0 0 15px red;
}

.hero{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

.logo-box{
    width:400px;
    max-width:90%;
    margin-bottom:40px;
    animation:fadeIn 1.5s ease-in-out;
}

.logo-box img{
    width:100%;
    filter:drop-shadow(0 0 25px red);
}

.btn{
    padding:15px 35px;
    background:red;
    color:black;
    text-decoration:none;
    font-weight:bold;
    border-radius:6px;
    transition:0.3s;
}

.btn:hover{
    background:#ff1a1a;
    transform:scale(1.1);
    box-shadow:0 0 20px red;
}

.next-section{
    min-height:100vh;
    padding:100px 20px;
    text-align:center;
    background:#0a0a0a;
}

.next-section h2{
    font-size:36px;
    color:red;
    text-shadow:0 0 15px red;
    margin:60px 0 40px;
}

.image-box{
    width:320px;
    height:320px;
    margin:0 auto 60px;
    border:3px solid red;
    border-radius:15px;
    box-shadow:0 0 25px red;
    overflow:hidden;
    transition:0.4s;
}

.image-box:hover{
    transform:scale(1.05);
    box-shadow:0 0 45px red;
}

.image-box img{
    width:100%;
    height:100%;
    object-fit:cover;
}

footer{
    text-align:center;
    padding:20px;
    background:#111;
    border-top:1px solid #8b0000;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(-20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<div id="particles-js"></div>

<header>
    <h1>ETERNAL</h1>
</header>

<section class="hero">
    <div class="logo-box">
        <img src="https://i.imgur.com/cWggiJL.png" alt="Logo Eternal">
    </div>
    <a href="#ranking" class="btn">Começar</a>
</section>

<section id="ranking" class="next-section">

    <h2>Top 1# noitefuI - (EtoK2)</h2>
    <div class="image-box">
        <img src="https://i.imgur.com/sTqcjhY.png">
    </div>

    <h2>Top 1# iizsox - (Ginkui)</h2>
    <div class="image-box">
        <img src="https://i.imgur.com/dKBfCWO.png">
    </div>

    <h2>Top 1# NickWolf999 - (Ixa)</h2>
    <div class="image-box">
        <img src="https://i.imgur.com/TSZ288B.png">
    </div>

    <h2>Top 1# chasingafterdream - (TakiK2)</h2>
    <div class="image-box">
        <img src="https://i.imgur.com/x1MShpY.png">
    </div>

    <h2>Top 1# 6xrsh - (Owl)</h2>
    <div class="image-box">
        <img src="https://i.imgur.com/1uJTtiJ.png">
    </div>

    <h2>Top 1# GodLucff - (Kosshi)</h2>
    <div class="image-box">
        <img src="https://imgur.com/NDGAFHf.png">
    </div>

</section>

<footer>
    © 2026 Eternal - Todos os direitos reservados.
</footer>

<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

<script>
particlesJS("particles-js",{
  particles:{
    number:{value:80},
    color:{value:"#ff0000"},
    shape:{type:"circle"},
    opacity:{value:0.7},
    size:{value:3},
    line_linked:{
      enable:true,
      distance:150,
      color:"#8b0000",
      opacity:0.4,
      width:1
    },
    move:{enable:true,speed:3}
  },
  interactivity:{
    detect_on:"canvas",
    events:{
      onhover:{enable:true,mode:"repulse"},
      onclick:{enable:true,mode:"push"}
    },
    modes:{
      repulse:{distance:100},
      push:{particles_nb:4}
    }
  },
  retina_detect:true
});
</script>

</body>
</html>
